# Production on a server Kimbiss shares with other services (Insulink first).
# Kimbiss terminates its own TLS with Caddy on its own ports and never touches
# ports 80 and 443 of the host. Hard limits keep it from starving its
# neighbours. See docs/SERVER.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
services:
  postgres:
    mem_limit: 256m
    cpus: 0.5
  api:
    mem_limit: 1g
    cpus: 1.0
  app:
    ports: !reset []
    mem_limit: 64m
    cpus: 0.25
  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      KIMBISS_DOMAIN: ${KIMBISS_DOMAIN:?set KIMBISS_DOMAIN in .env}
    ports:
      - "${KIMBISS_HTTP_PORT:-8088}:80"
      - "${KIMBISS_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - app

volumes:
  caddy-data:
