spring.main.banner-mode=off
server.servlet.context-path=/v1
# Past the estimate CLI's 60 s, so a slow run ends with its own error.
spring.mvc.async.request-timeout=75000
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/kimbiss}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sign-up needs this code. Leave it empty to close sign-up entirely.
kimbiss.invite-code=${KIMBISS_INVITE_CODE:}
# Photo estimates per user and day; caps what a leaked session can spend.
kimbiss.estimates-per-day=${KIMBISS_ESTIMATES_PER_DAY:30}
