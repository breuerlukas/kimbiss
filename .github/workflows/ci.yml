name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A new push to a branch makes the run already in flight pointless, so drop it.
# main is exempt: every merge must reach the registry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kimbiss-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kimbiss-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kimbiss-app/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Self-checks
        run: npm run check

  # Publishes the images the server pulls on a timer (docs/SERVER.md). Push to
  # main only: a fork's pull request must not reach the registry, and only what
  # landed on main gets deployed. The images hold no secrets; .env on the
  # server supplies them.
  publish:
    if: github.event_name == 'push'
    needs: [api, app]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        part: [api, app]
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: kimbiss-${{ matrix.part }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.part }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.part }}:sha-${{ github.sha }}
